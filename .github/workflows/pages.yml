# Interaktive Kreiskarte als GitHub-Pages-Site bauen und deployen.
# Die Karte ist ein reiner Consumer der Pipeline: Daten aus
# merged_raw_v3.json (Pipeline-Assertions laufen mit), Geometrie aus
# der BKG-VG250 (67 MB Download), vereinfacht per src/build_map.py
# (Standardbibliothek, ~2 MB GeoJSON). Kein pip/ npm noetig.
name: Karte (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pipeline (nur Standardbibliothek)
        run: |
          python3 src/unpack_base.py
          python3 src/parse_zensus.py
          python3 src/merge.py

      - name: VG250 herunterladen (~67 MB)
        run: python3 src/fetch_vg250.py

      - name: Kartendaten + vereinfachte Kreisgeometrie (Join-Verifikation)
        run: python3 src/build_map.py

      - name: Site zusammenstellen
        run: cp -r site/* _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - id: deployment
        uses: actions/deploy-pages@v4
