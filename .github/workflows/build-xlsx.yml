# Baut die Release-Artefakte aus den committeten, verifizierten Daten:
#   data/deutschland-rohdaten.xlsx      (401 x 109 + Registry-Blatt)
#   data/deutschland-rohdaten.parquet   (400 x 109, R-Analyse)
#   data/deutschland-variablen.parquet (Registry, 109 Eintraege)
# Laeuft bei JEDEM Push auf main und committet bei inhaltlicher
# Aenderung selbst ([skip ci]-Marker verhindert Schleifen).
# Kernpipeline (unpack_base -> parse_zensus -> merge -> build_xlsx)
# braucht nur openpyxl und validiert per Assertions gegen amtliche
# Pruefzahlen; der Parquet-Step fuegt pyarrow hinzu und liest die
# Dateien zur Verifikation zurueck.
name: Build XLSX + Parquet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten
        run: pip install openpyxl pyarrow

      - name: Pipeline (Basis entpacken, Zensus einarbeiten, mergen, XLSX bauen)
        run: |
          python3 src/unpack_base.py
          python3 src/parse_zensus.py
          python3 src/merge.py
          python3 src/build_xlsx.py data/deutschland-rohdaten.xlsx

      - name: Parquet-Export (Release nach data/)
        run: python3 src/export_parquet.py data/deutschland-rohdaten.xlsx data

      - name: Verifikation (Parquet zuruecklesen, Struktur und rs pruefen)
        run: |
          python3 - <<'PY'
          import pyarrow.parquet as pq
          t = pq.read_table('data/deutschland-rohdaten.parquet')
          assert t.num_rows == 400 and t.num_columns == 109, (t.num_rows, t.num_columns)
          r = pq.read_table('data/deutschland-variablen.parquet')
          assert r.num_rows == 109, r.num_rows
          rs = set(t.column('rs').to_pylist())
          assert '01001' in rs and '11000' in rs and '02000' in rs, 'fuehrende Nullen verloren'
          print('OK: parquet 400x109, registry 109, rs mit fuehrenden Nullen')
          PY

      - name: Bei Aenderung committen
        run: |
          git add data/deutschland-rohdaten.xlsx data/deutschland-rohdaten.parquet data/deutschland-variablen.parquet
          if git diff --cached --quiet; then
            echo "Release-Artefakte unveraendert, kein Commit noetig."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): Release-Artefakte (XLSX + Parquet) aus Pipeline neu gebaut [skip ci]"
          git push
