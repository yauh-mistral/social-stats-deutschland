# Baut data/deutschland-rohdaten.xlsx aus den committeten Datenbasis-Dateien
# und committet sie, falls sich Inhalte geaendert haben. Damit ist die
# Binaerdatei immer synchron zum Quellcode (Agent-Umgebungen koennen keine
# Binaerdateien pushen, lokale Builds sind dafuer nicht noetig).
name: Build XLSX

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/**'
      - '.github/workflows/build-xlsx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten
        run: pip install openpyxl

      - name: Pipeline (Basis entpacken, Zensus einarbeiten, mergen, XLSX bauen)
        run: |
          python3 src/unpack_base.py
          python3 src/parse_zensus.py
          python3 src/merge.py
          python3 src/build_xlsx.py data/deutschland-rohdaten.xlsx

      - name: Bei Aenderung committen
        run: |
          if git diff --quiet -- data/deutschland-rohdaten.xlsx; then
            echo "XLSX unveraendert, kein Commit noetig."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deutschland-rohdaten.xlsx
          git commit -m "chore(data): deutschland-rohdaten.xlsx aus Pipeline neu gebaut [skip ci]"
          git push
